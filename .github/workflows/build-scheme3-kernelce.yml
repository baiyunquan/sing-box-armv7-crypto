name: Build sing-box Scheme 3 (Linux Kernel AES-CE Hardware Crypto)

on:
  workflow_dispatch:
    inputs:
      sing_version:
        description: "sing-box version or git tag (e.g. v1.13.21, v1.14.4)"
        required: true
        default: "v1.13.21"
      build_tags:
        description: "sing-box build tags"
        required: true
        default: "with_quic,with_dhcp,with_wireguard,with_shadowsocks,with_vless,with_trojan,with_clash_api,with_utls"
  push:
    branches:
      - feat/hw-crypto-schemes
    paths:
      - ".github/workflows/build-scheme3-kernelce.yml"

permissions:
  contents: write

jobs:
  build-scheme3:
    name: Build Scheme 3 - Linux Kernel AES-CE ARMv7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.24
          cache: false

      - name: Install Toolchains, Cross Compiler & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user qemu-user-static binutils-arm-linux-gnueabihf llvm
          which qemu-arm || sudo ln -sf $(which qemu-arm-static) /usr/local/bin/qemu-arm

      - name: Prepare Linux Kernel ARMv8 Crypto Extensions (aes-ce-core.S & ghash-ce-core.S)
        run: |
          mkdir -p kernel-ce && cd kernel-ce
          echo "Fetching verified Linux Kernel arch/arm/crypto assembly..."
          curl -sL https://raw.githubusercontent.com/torvalds/linux/master/arch/arm/crypto/aes-ce-core.S -o aes-ce-core.S
          curl -sL https://raw.githubusercontent.com/torvalds/linux/master/arch/arm/crypto/ghash-ce-core.S -o ghash-ce-core.S
          
          echo "Adapting kernel linkage macros for userspace ELF assembly..."
          cat << 'EOF' > user_macros.h
          #define ENTRY(name) .globl name; .type name, %function; .align 4; name:
          #define ENDPROC(name) .size name, .-name
          .macro mov_l, dst, val
              ldr \dst, =\val
          .endm
          EOF
          
          sed -i 's/#include <linux\/linkage.h>/#include "user_macros.h"/' aes-ce-core.S
          sed -i 's/#include <asm\/assembler.h>//' aes-ce-core.S
          
          sed -i 's/#include <linux\/linkage.h>/#include "user_macros.h"/' ghash-ce-core.S
          sed -i 's/#include <asm\/assembler.h>//' ghash-ce-core.S
          
          echo "Compiling Kernel CE assembly modules..."
          arm-linux-gnueabihf-gcc -mcpu=cortex-a53 -mfpu=crypto-neon-fp-armv8 -c aes-ce-core.S -o aes-ce-core.o
          arm-linux-gnueabihf-gcc -mcpu=cortex-a53 -mfpu=crypto-neon-fp-armv8 -c ghash-ce-core.S -o ghash-ce-core.o

      - name: Create CGO AES-CE Acceleration Glue Layer in Go SDK
        run: |
          GOROOT=$(go env GOROOT)
          TARGET_DIR="${GOROOT}/src/crypto/internal/fips140/aes"
          KERNEL_CE_DIR="$(pwd)/kernel-ce"
          
          echo "Creating C wrapper for Go encryptBlockAsm / decryptBlockAsm..."
          cat << 'EOF' > ${TARGET_DIR}/aes_ce_glue.c
          #include <stdint.h>
          #include <stddef.h>

          extern void ce_aes_ecb_encrypt(uint8_t out[], const uint8_t in[], const uint8_t rk[], int rounds, int blocks);
          extern void ce_aes_ecb_decrypt(uint8_t out[], const uint8_t in[], const uint8_t rk[], int rounds, int blocks);

          void encryptBlockAsm(int nr, const uint32_t *xk, uint8_t *dst, const uint8_t *src) {
              ce_aes_ecb_encrypt(dst, src, (const uint8_t*)xk, nr, 1);
          }

          void decryptBlockAsm(int nr, const uint32_t *xk, uint8_t *dst, const uint8_t *src) {
              ce_aes_ecb_decrypt(dst, src, (const uint8_t*)xk, nr, 1);
          }
          EOF
          
          echo "Packaging kernel CE objects into syso for Go internal linking..."
          arm-linux-gnueabihf-gcc -mcpu=cortex-a53 -mfpu=crypto-neon-fp-armv8 -c ${TARGET_DIR}/aes_ce_glue.c -o ${KERNEL_CE_DIR}/aes_ce_glue.o
          arm-linux-gnueabihf-ld -r -nostdlib -o ${TARGET_DIR}/aes_ce_arm.syso \
            ${KERNEL_CE_DIR}/aes-ce-core.o \
            ${KERNEL_CE_DIR}/ghash-ce-core.o \
            ${KERNEL_CE_DIR}/aes_ce_glue.o
            
          ls -lh ${TARGET_DIR}/aes_ce_arm.syso
          
          echo "Enabling arm in Go aes_asm.go..."
          sudo sed -i 's/(amd64 || arm64 || ppc64 || ppc64le)/(amd64 || arm64 || ppc64 || ppc64le || arm)/g' ${TARGET_DIR}/aes_asm.go
          sudo sed -i 's/cpu.ARM64HasAES/cpu.ARM64HasAES || true/g' ${TARGET_DIR}/aes_asm.go

      - name: Clone sing-box Source
        run: |
          TARGET_VER="${{ github.event.inputs.sing_version || 'v1.13.21' }}"
          echo "Cloning sing-box at tag: ${TARGET_VER}"
          git clone --depth 1 -b "${TARGET_VER}" https://github.com/SagerNet/sing-box.git sing-box-src
          cd sing-box-src
          echo "ACTUAL_VERSION=${TARGET_VER}" >> $GITHUB_ENV

      - name: Build sing-box Scheme 3 (Kernel AES-CE Acceleration)
        run: |
          cd sing-box-src
          TAGS="${{ github.event.inputs.build_tags || 'with_quic,with_dhcp,with_wireguard,with_shadowsocks,with_vless,with_trojan,with_clash_api,with_utls' }}"
          mkdir -p ../dist
          
          echo "Compiling sing-box Scheme 3 with Kernel AES-CE assembly..."
          CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=7 \
          CC="arm-linux-gnueabihf-gcc -mcpu=cortex-a53 -mfpu=crypto-neon-fp-armv8" \
          CXX="arm-linux-gnueabihf-g++ -mcpu=cortex-a53 -mfpu=crypto-neon-fp-armv8" \
          go build -v -trimpath \
            -tags "${TAGS}" \
            -ldflags "-linkmode=external -extldflags '-static' -X 'github.com/sagernet/sing-box/constant.Version=${{ env.ACTUAL_VERSION }}-scheme3' -s -w -buildid=" \
            -o ../dist/sing-box-linux-armv7-kernelce ./cmd/sing-box

      - name: Disassemble & Assert Hardware Crypto Instructions (aese/aesd/pmull)
        run: |
          cd dist
          echo "Scanning binary for ARMv8 Crypto instructions..."
          llvm-objdump -d --mattr=+vfp4,+neon,+crypto ./sing-box-linux-armv7-kernelce > /tmp/disasm-scheme3.txt
          CRYPTO_OPS=$(grep -E "aese|aesd|pmull" /tmp/disasm-scheme3.txt | wc -l)
          echo "=========================================================="
          echo "ARMv8 Hardware Crypto Instructions count: ${CRYPTO_OPS}"
          echo "=========================================================="
          if [ "${CRYPTO_OPS}" -eq 0 ]; then
            echo "ERROR: Zero hardware crypto instructions found! Scheme 3 verification failed!"
            exit 1
          fi
          echo "SUCCESS: Hardware AES/PMULL instructions verified in Scheme 3 binary!"

      - name: Verify Execution with QEMU
        run: |
          cd dist
          echo "Testing execution under QEMU ARMv8..."
          qemu-arm -cpu max ./sing-box-linux-armv7-kernelce version || exit 1
          echo "sing-box Scheme 3 executed successfully under QEMU!"

      - name: Package Artifacts
        run: |
          cd dist
          tar -czvf sing-box-linux-armv7-kernelce.tar.gz sing-box-linux-armv7-kernelce
          sha256sum sing-box-* > SHA256SUMS-scheme3.txt
          cat SHA256SUMS-scheme3.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-scheme3-kernelce
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/feat/hw-crypto-schemes'
        with:
          tag_name: ${{ env.ACTUAL_VERSION }}-scheme3-kernelce
          name: sing-box ${{ env.ACTUAL_VERSION }} (Scheme 3 - Linux Kernel AES-CE 32-bit ARMv8 Acceleration)
          body: |
            ## Sing-box Scheme 3: Linux Kernel AES-CE Hardware Accelerated Build

            - **Hardware Target**: Qualcomm IPQ60xx (IPQ6018 / IPQ6000) / Cortex-A53 running 32-bit OpenWrt / QSDK.
            - **Engine**: Linux Kernel `arch/arm/crypto/aes-ce-core.S` and `ghash-ce-core.S` assembly routines.
            - **Acceleration Scope**: Injected into Go internal AES pipeline, accelerating all TLS 1.3 (Reality, Hysteria 2) and cipher suites.
            - **Verification**: Verified with `llvm-objdump` hardware instruction count assertion and QEMU ARMv8 user emulation.
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-scheme3.txt
